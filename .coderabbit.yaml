# CodeRabbit configuration for binan_accesscard (CodeIgniter 4).
# Docs: https://docs.coderabbit.ai/reference/yaml-template
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false

  # Skip generated / vendored / non-source paths so reviews stay focused on app code.
  path_filters:
    - "!vendor/**"
    - "!writable/**"
    - "!public/vendor/**"
    - "!public/assets/**/*.min.js"
    - "!**/*.sql"
    - "!**/*.xlsx"
    - "!docs/superpowers/**"
